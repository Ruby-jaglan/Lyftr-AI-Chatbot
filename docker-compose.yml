services:
  backend:
    restart: unless-stopped
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:////data/app.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - app_data:/data
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports: ["${FRONTEND_PORT:-3000}:80"]
    depends_on: [backend]
volumes:
  app_data:
